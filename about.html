<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Johnston Anton | Digital Marketer</title>
<meta name="description" content="Learn about Johnston Anton, a digital marketer focused on Meta Ads, Google Ads and SEO, and how he works with businesses to grow online.">

<meta property="og:title" content="About Johnston Anton | Digital Marketer">
<meta property="og:description" content="Learn about Johnston Anton, a digital marketer focused on Meta Ads, Google Ads and SEO, and how he works with businesses to grow online.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.yourdomain.com/about.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#d4f0df;--surface:#f5fcf8;--ink:#0b2418;--muted:#3b5a49;--line:#a9d3bb;--accent:#0b6b3a;--accent-2:#12a35e;--navy:#0b2a1b;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#0d2a1c;--surface:#143726;--ink:#eaf7ef;--muted:#a6c7b3;--line:#25513a;--accent:#4ade80;--accent-2:#22c55e;--navy:#071a11}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:17px/1.65 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,.brand{font-family:"Sora","Segoe UI",system-ui,sans-serif;line-height:1.2;letter-spacing:-.02em}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.brand{font-weight:700;font-size:19px;text-decoration:none}
nav ul{display:flex;gap:6px;list-style:none;padding:0;flex-wrap:wrap}
nav a{display:block;padding:8px 14px;border-radius:999px;text-decoration:none;font-size:15px;color:var(--muted)}
nav a:hover{color:var(--ink)}
nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
.hero{padding:88px 0 72px}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:center}
h1{font-size:clamp(34px,5vw,56px);font-weight:700}
.lead{font-size:20px;color:var(--muted);margin:20px 0 32px;max-width:34em}
.btn{display:inline-block;padding:13px 24px;border-radius:var(--r);background:var(--accent);color:#fff;text-decoration:none;font-weight:600;border:0;font:inherit;font-weight:600;cursor:pointer}
@media(prefers-color-scheme:dark){.btn{color:#04201c}}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:10px}
.btn:hover{filter:brightness(1.08)}
.panel{background:var(--navy);color:#eef3f9;border-radius:16px;padding:28px}
.panel h2{font-size:15px;font-weight:600;color:#a6c7b3;margin-bottom:18px}
.bar{margin-bottom:16px}
.bar{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline}.bar span{font-size:15px;margin-bottom:6px}.bar span+span{color:#a6c7b3;font-size:14px}.bar i{grid-column:1/-1}
.bar i{display:block;height:8px;border-radius:99px;background:#25513a;overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#86efac);border-radius:99px;transform-origin:left;animation:grow 1.1s ease-out both}
@keyframes grow{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.bar b{animation:none}html{scroll-behavior:auto}}
.panel p{font-size:14px;color:#a6c7b3;margin-top:20px}
section.block{padding:64px 0;border-top:1px solid var(--line)}
.page-title{padding:72px 0 32px}
.page-title p{color:var(--muted);font-size:20px;max-width:36em;margin-top:14px}
h2{font-size:28px;margin-bottom:24px}
h3{font-size:19px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.card p,.card li{color:var(--muted)}
.card ul{padding-left:20px;margin-top:12px}
.tl{border-left:2px solid var(--line);padding-left:28px;margin-left:6px}
.tl article{position:relative;padding-bottom:40px}
.tl article::before{content:"";position:absolute;left:-36px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.meta{color:var(--accent);font-weight:600;font-size:15px;margin-bottom:6px}
.tl ul{padding-left:20px;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1.4fr;gap:56px}
.avatar{aspect-ratio:1;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--navy));display:grid;place-items:center;color:#fff;font:700 64px "Sora",sans-serif}
.split p{margin-bottom:16px;color:var(--muted)}
form{display:grid;gap:16px}
label{font-weight:600;font-size:15px;display:grid;gap:6px}
input,textarea{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.cta{background:var(--navy);color:#eef3f9;border-radius:16px;padding:48px;text-align:center;margin:64px 0}
.cta p{color:#a6c7b3;margin:12px 0 24px}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:15px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
@media(max-width:800px){.hero .wrap,.split{grid-template-columns:1fr}.grid{grid-template-columns:1fr}header .wrap{height:auto;padding-top:12px;padding-bottom:12px;flex-direction:column;align-items:flex-start}.cta{padding:32px 20px}.btn.alt{margin:10px 0 0}}
/* ===== Home page animations and hover effects ===== */
.hero{position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.45;background:var(--accent-2);animation:drift 14s ease-in-out infinite alternate}
.b1{width:280px;height:280px;left:-80px;top:20px}
.b2{width:200px;height:200px;right:12%;top:-60px;animation-duration:18s;opacity:.3}
.b3{width:240px;height:240px;right:-60px;bottom:-80px;animation-duration:11s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,40px) scale(1.2)}}
.intro>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.intro>*:nth-child(1){animation-delay:.1s}.intro>*:nth-child(2){animation-delay:.3s}.intro>*:nth-child(3){animation-delay:.5s}.intro>*:nth-child(4){animation-delay:.7s}
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.role{font:600 20px "Sora",sans-serif;margin-top:18px;color:var(--accent)}
.intro .lead{margin-top:14px}
.mascot{animation:up .9s .4s cubic-bezier(.2,.7,.2,1) both}
.mascot svg{width:100%;height:auto;display:block;overflow:visible}
.halo{fill:var(--accent);opacity:.18;transform-origin:210px 190px;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.fl{animation:float 3.4s ease-in-out infinite}
.f2{animation-delay:-.8s}.f3{animation-delay:-1.6s}.f4{animation-delay:-2.4s}
@keyframes float{50%{transform:translateY(-14px) rotate(6deg)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.js .rv:not(.in){opacity:0}
.rv.in{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.97)}}
.brand{transition:letter-spacing .25s,color .25s}.brand:hover{letter-spacing:.02em;color:var(--accent)}
nav a{position:relative;transition:color .2s,background .2s}
nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .25s}
nav a:hover::after{transform:scaleX(1)}nav a[aria-current=page]::after{display:none}
.btn{position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,background .2s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%)}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(11,107,58,.35)}
.btn:hover::after{transform:translateX(120%);transition:transform .7s}
.btn:active{transform:translateY(0) scale(.97)}
.btn.alt:hover{border-color:var(--accent);background:var(--surface)}
.card{position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s}
.card::before{content:"";position:absolute;left:0;top:0;height:4px;width:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transform:scaleX(0);transform-origin:left;transition:transform .35s}
.card:hover{transform:translateY(-10px);box-shadow:0 18px 36px rgba(11,107,58,.22);border-color:var(--accent)}
.card:hover::before{transform:scaleX(1)}
.card h3{transition:color .25s}.card:hover h3{color:var(--accent)}
.ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--bg);margin-bottom:16px;transition:transform .4s cubic-bezier(.3,1.8,.5,1),background .3s}
.card:hover .ico{transform:rotate(-12deg) scale(1.2);background:var(--accent-2)}
.cta{transition:transform .35s,box-shadow .35s}.cta:hover{transform:scale(1.015);box-shadow:0 22px 44px rgba(11,107,58,.3)}
footer a,footer span{transition:color .2s}footer span:hover{color:var(--accent)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv:not(.in){opacity:1}.ticker{overflow-x:auto}}
.hero{padding:64px 0 56px}.card li{transition:transform .2s,color .2s}.card li:hover{transform:translateX(8px);color:var(--ink)}

/* ===== About page: meet-me animations ===== */
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
.hero{padding:64px 0 56px}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle 230px at var(--mx,70%) var(--my,40%),rgba(18,163,94,.22),transparent 70%);pointer-events:none}
.words{overflow:visible}
.words span{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-right:.22em}
.words i{display:inline-block;font-style:normal;transform:translateY(115%);animation:wordUp .9s cubic-bezier(.2,.7,.2,1) forwards}
.words span:nth-child(1) i{animation-delay:.2s}.words span:nth-child(2) i{animation-delay:.4s}
@keyframes wordUp{to{transform:none}}
.intro>h1.words{animation:none}
.intro .lead{margin-top:18px}
.nod{transform-origin:150px 226px;animation:nod 3s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(3deg)}60%{transform:rotate(-2.5deg)}}
.tapL,.tapR{animation:tap .4s ease-in-out infinite alternate}.tapR{animation-delay:-.2s}
@keyframes tap{to{transform:translateY(-7px)}}
.logo{transform-box:fill-box;transform-origin:center;animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.3);opacity:.7}}
.sway{transform-origin:75px 262px;animation:sway 3.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
.steam{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;opacity:0;animation:steam 2.4s ease-in infinite}
.s2{animation-delay:-.8s}.s3{animation-delay:-1.6s}
@keyframes steam{0%{transform:translateY(8px);opacity:0}30%{opacity:.8}100%{transform:translateY(-16px);opacity:0}}
.ic{transform-box:fill-box;transform-origin:center;opacity:0;animation:cyc 6s ease-in-out infinite}
.i2{animation-delay:2s}.i3{animation-delay:4s}
@keyframes cyc{0%{opacity:0;transform:scale(.4)}6%,30%{opacity:1;transform:scale(1)}36%,100%{opacity:0;transform:scale(.4)}}
.bubble{transform-origin:109px 66px;animation:pop .6s 1.2s cubic-bezier(.3,1.6,.5,1) both}
.mascot:hover .nod{animation-duration:.9s}
.mascot:hover .tapL,.mascot:hover .tapR{animation-duration:.18s}
.mascot:hover .steam{animation-duration:1.2s}
.avatar{position:relative;isolation:isolate;transition:transform .35s}
.avatar::before{content:"";position:absolute;inset:-6px;border-radius:22px;z-index:-1;background:conic-gradient(from var(--a),var(--accent),var(--accent-2),#86efac,var(--accent));animation:spin 6s linear infinite}
@keyframes spin{to{--a:360deg}}
.avatar{background:none}.avatar::after{content:"";position:absolute;inset:0;border-radius:16px;z-index:-1;background:linear-gradient(135deg,var(--accent),var(--navy))}
.avatar:hover{transform:scale(1.03) rotate(-1.5deg)}.avatar:hover::before{animation-duration:2s}
.chip{position:absolute;background:var(--surface);color:var(--ink);font:600 14px "Sora",sans-serif;padding:8px 14px;border-radius:999px;border:1px solid var(--line);box-shadow:0 8px 20px rgba(11,107,58,.25);animation:bob2 3.2s ease-in-out infinite}
.c1{top:12%;right:-16px}.c2{left:-16px;top:48%;animation-delay:-1.1s}.c3{bottom:10%;right:-8px;animation-delay:-2.2s}
@keyframes bob2{50%{transform:translateY(-10px)}}
.wp.rv.in{animation:wipe 1s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--d,0s)}
@keyframes wipe{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.grid .card.rv.in{animation:deal .9s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--d,0s)}
.grid .card:nth-child(2).rv.in{animation-name:deal2}
@keyframes deal{from{opacity:0;transform:translateY(60px) rotate(-7deg)}}
@keyframes deal2{from{opacity:0;transform:translateY(60px) rotate(6deg)}}
.card{transition:transform .15s,box-shadow .3s,border-color .3s}
.card:hover{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-10px)}
.btn.pulse{animation:btnpulse 2.4s ease-out infinite}.btn.pulse:hover{animation:none}
@keyframes
